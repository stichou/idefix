[Grid]
X1-grid    1  1  256  l  10
X2-grid    1  0.0  768  u  6.283185307179586
X3-grid    1  0.0  1    u  1.0

[TimeIntegrator]
CFL         0.3
tstop       80000
first_dt    1.e-3
nstages     2

[Hydro]
solver    hllc
csiso     userdef
gamma     1.667
shockFlattening 5

[Gravity]
potential    central
Mcentral     1.0
#bodyForce    userdef

[Fargo]
velocity    userdef

[Boundary]
X1-beg    outflow 
X1-end    outflow 
X2-beg    periodic
X2-end    periodic
X3-beg    outflow
X3-end    outflow

[Setup]
aspect_ratio    0.1     # dimensionless
jump_radius     20.0
jump_width      4.0
sigma0          0.015915
sigma_slope     -2.0
beta_cooling    5

[Output]
vtk     6.283185309
#vtk    125.66370614359172
log    1000
dmp    314.15926545
uservar forceSGx forceSGy toomre
