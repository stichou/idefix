[Grid]
X1-grid    1  -0.5  128  u  0.5
X2-grid    1  -0.5  128  u  0.5

[TimeIntegrator]
CFL         0.4
tstop       8.0
first_dt    1.e-4
nstages     2

[Hydro]
rotation       1.0
shearingBox    -1.5
solver         hllc
gamma          2.0

[Gravity]
potential    selfgravity
gravCst      1.0
bodyForce    userdef

[SelfGravity]
solver         FFTShearingBox2D
kernel         razor
scaleHeight    0.0785398163397448
lambda         0.0

[Boundary]
X1-beg    shearingbox
X1-end    shearingbox
X2-beg    periodic
X2-end    periodic

[Output]
vtk    0.1
log    1

[Setup]
sigma0       0.025
Q            1.0
amplitude    5.e-4
kx0          -2.0
ky           1.0
