[Grid]
X1-grid    1  0.0  64  u  6.0
X2-grid    1  0.0  64  u  6.0
X3-grid    1  0.0  64  u  6.0

[TimeIntegrator]
CFL         0.8
tstop       1.e-4
first_dt    1.e-4
nstages     2

[Hydro]
shearingBox    0.0
solver         hll
gamma          1.66666666667

[Gravity]
potential    selfgravity
gravCst      1.0

[SelfGravity]
solver             FFTShearingBox3D
boundary-X1-beg    periodic
boundary-X1-end    periodic
boundary-X2-beg    periodic
boundary-X2-end    periodic

[Boundary]
X1-beg    periodic
X1-end    periodic
X2-beg    periodic
X2-end    periodic
X3-beg    outflow
X3-end    outflow

[Output]
vtk    1.e-4
log    1
