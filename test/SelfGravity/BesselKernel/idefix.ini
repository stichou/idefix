[Grid]
X1-grid    1  20  256  l  250
X2-grid    1  0.0  512  u  6.283185307179586
X3-grid    1  0.0  1    u  1.0

[TimeIntegrator]
CFL         0.8
tstop       50
first_dt    1.e-3
nstages     2

[Hydro]
solver    hllc
csiso     userdef
gamma     1.4

[Gravity]
potential    central
Mcentral     1.0
#bodyForce    userdef

[Fargo]
velocity    userdef

[Boundary]
X1-beg    outflow
X1-end    outflow
X2-beg    periodic
X2-end    periodic
X3-beg    outflow
X3-end    outflow

[Setup]
# tuning:
# the goal is find a point in the parameter space where the disk can be RWI unstable
# while staying rotationally stable.
# this example parametrization checks those requirements
aspect_ratio    0.1     # dimensionless
jump_radius     0.05
jump_width      0.15
nx 512
ny 2048

[Output]
vtk    6.283185307179586
log    1000
#dmp    6.283185307179586
uservar forceSGx forceSGy 
